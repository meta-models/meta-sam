name: Python release readiness

on:
  pull_request:
    paths:
      - ".github/workflows/python.yml"
      - "README.md"
      - "conformance/**"
      - "protocol/**"
      - "python/**"
      - "scripts/check-compatibility.cjs"
      - "scripts/compatibility-matrix.cjs"
      - "scripts/run-process.cjs"
      - "scripts/run-python.cjs"
      - "scripts/run-typescript.cjs"
      - "scripts/sync-compatibility"
      - "scripts/validate"
      - "scripts/validate-conformance"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/tsconfig.base.json"
      - "typescript/tsconfig.json"
      - "typescript/tsconfig.tests.json"
      - "typescript/vitest.config.ts"
      - "typescript/examples/api-playground/package-lock.json"
      - "typescript/packages/graphics/package.json"
      - "typescript/packages/parser/**"
      - "typescript/packages/react/package.json"
      - "typescript/packages/video/package.json"
      - "typescript/test/conformance/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python.yml"
      - "README.md"
      - "conformance/**"
      - "protocol/**"
      - "python/**"
      - "scripts/check-compatibility.cjs"
      - "scripts/compatibility-matrix.cjs"
      - "scripts/run-process.cjs"
      - "scripts/run-python.cjs"
      - "scripts/run-typescript.cjs"
      - "scripts/sync-compatibility"
      - "scripts/validate"
      - "scripts/validate-conformance"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/tsconfig.base.json"
      - "typescript/tsconfig.json"
      - "typescript/tsconfig.tests.json"
      - "typescript/vitest.config.ts"
      - "typescript/examples/api-playground/package-lock.json"
      - "typescript/packages/graphics/package.json"
      - "typescript/packages/parser/**"
      - "typescript/packages/react/package.json"
      - "typescript/packages/video/package.json"
      - "typescript/test/conformance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Build wheel and sdist
        run: python scripts/build_artifacts.py
      - name: Audit artifacts and reproducibility
        run: python scripts/audit_distribution.py --mode artifacts
      - name: Upload audited distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7

  supported-versions:
    needs: build-and-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: python/dist
      - name: Install tested wheel and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.0.3 pytest-cov==7.0.0 jsonschema==4.25.1 dist/*.whl
      - name: Test installed wheel
        run: python -m pytest

  clean-consumers:
    needs: build-and-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/requirements-openai.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: python/dist
      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check mypy==1.18.2
      - name: Audit clean wheel and sdist consumers
        run: python scripts/audit_distribution.py --mode consumers

  cross-language-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install npm 11
        working-directory: typescript
        run: npm install --global npm@11.16.0
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci
      - name: Install Python dependencies
        working-directory: python
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run both conformance implementations
        run: node scripts/validate-conformance
