[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "meta-sam-parser"
version = "0.0.5"
description = "Native Python parsing primitives for the SAM 3 segmentation protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
license-files = ["LICENSE"]
authors = [{ name = "Meta Platforms, Inc." }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "jsonschema==4.25.1",
  "mypy==1.18.2",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[project.urls]
Homepage = "https://dev.meta.ai/"
Repository = "https://github.com/meta-models/meta-sam"
Issues = "https://github.com/meta-models/meta-sam/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_sam_parser"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
]
exclude = [
  ".gitignore",
  "/consumer",
  "/dist",
  "/scripts",
  "/tests",
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=meta_sam_parser --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "conformance: validates shared language-neutral parser cases and mask vectors",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
